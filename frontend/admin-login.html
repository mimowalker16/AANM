<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion administrateur - AANM</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/logo.png" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--clr-dark);
            padding: var(--space-md);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--clr-white);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            box-shadow: var(--shadow-xl);
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
            justify-content: center;
        }

        .login-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .login-logo-text {
            font-family: var(--ff-heading);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--clr-primary);
        }

        .login-heading {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .login-heading h1 {
            font-family: var(--ff-heading);
            font-size: var(--fs-h3);
            font-weight: 700;
            color: var(--clr-text);
            margin-bottom: 0.35rem;
        }

        .login-heading p {
            font-size: var(--fs-small);
            color: var(--clr-text-light);
        }

        .login-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(27, 94, 58, 0.08);
            color: var(--clr-primary);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            margin-bottom: var(--space-md);
        }

        .login-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--clr-primary);
        }

        .login-form .form-group {
            margin-bottom: var(--space-md);
        }

        .login-form label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--clr-text);
            margin-bottom: 0.45rem;
        }

        .login-form input {
            width: 100%;
            padding: 0.8rem var(--space-sm);
            border: 1.5px solid var(--clr-bg-alt);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: var(--fs-body);
            color: var(--clr-text);
            background: var(--clr-bg);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--clr-primary);
            background: var(--clr-white);
            box-shadow: 0 0 0 3px rgba(27, 94, 58, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--clr-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: var(--fs-body);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            box-shadow: 0 4px 15px rgba(27, 94, 58, 0.25);
        }

        .login-btn:hover:not(:disabled) {
            background: var(--clr-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(27, 94, 58, 0.35);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner { display: block; }
        .login-btn.loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-error {
            display: none;
            margin-top: var(--space-md);
            padding: 0.75rem var(--space-sm);
            background: rgba(199, 91, 57, 0.08);
            border: 1px solid rgba(199, 91, 57, 0.25);
            border-radius: var(--radius-md);
            color: var(--clr-secondary-dark);
            font-size: var(--fs-small);
            font-weight: 500;
            text-align: center;
        }

        .login-error.show { display: block; }

        .login-back {
            display: block;
            text-align: center;
            margin-top: var(--space-lg);
            font-size: var(--fs-small);
            color: var(--clr-text-light);
        }

        .login-back a {
            color: var(--clr-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .login-back a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="/api-config.js"></script>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="./assets/images/logo.png" alt="Logo AANM">
            <span class="login-logo-text">AANM</span>
        </div>

        <div class="login-heading">
            <span class="login-badge">Accès Restreint</span>
            <h1>Administration</h1>
            <p>Connectez-vous pour accéder au tableau de bord</p>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Se connecter</span>
                <div class="spinner"></div>
            </button>

            <div class="login-error" id="loginError">
                Identifiants incorrects. Veuillez réessayer.
            </div>
        </form>

        <span class="login-back">
            <a href="./index.html">← Retour au site</a>
        </span>
    </div>

    <script>
        const API_BASE = window.AANM_API_BASE;
        // If already logged in, redirect immediately
        const existingToken = sessionStorage.getItem('adminToken');
        if (existingToken) {
            window.location.replace('./admin-dashboard.html');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorEl.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success && data.token) {
                    sessionStorage.setItem('adminToken', data.token);
                    window.location.replace('./admin-dashboard.html');
                } else {
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = 'Impossible de contacter le serveur. Vérifiez votre connexion.';
                errorEl.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
