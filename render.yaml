services:
  - type: web
    name: aanm-backend
    runtime: node
    region: frankfurt     # closest to Algeria / North Africa
    plan: free            # upgrade to "starter" ($7/mo) to eliminate cold starts
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true      # redeploy automatically on git push

    envVars:
      # Render injects PORT automatically — do not set it manually
      - key: NODE_ENV
        value: production

      # Render sits behind a reverse proxy — required for rate-limiting by real IP
      - key: TRUST_PROXY
        value: "1"

      # ── Database ─────────────────────────────────────────────────────────────
      # Supabase Transaction pooler (port 6543) — set this in the Render dashboard.
      # postgresql://postgres.rrpaajtctdavlhwuffsy:[password]@aws-0-eu-central-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false       # secret — fill it in the Render dashboard, never commit

      # Supabase pooler uses a self-signed cert chain; rejectUnauthorized: false.
      - key: DATABASE_SSL
        value: "true"

      # Tables are managed in Supabase — skip the startup DDL migration.
      - key: SKIP_TABLE_INIT
        value: "true"

      # Keep pool small — Supabase free tier caps underlying connections at 15.
      - key: DB_POOL_MAX
        value: "5"

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Replace with your actual Sevalla Pages URL once you have it.
      # Add both the bare domain and www if you use both.
      - key: ALLOWED_ORIGINS
        value: https://aanm-front-0qv30.sevalla.page,https://aanmassal.org,https://www.aanmassal.org


      # ── Admin auth ───────────────────────────────────────────────────────────
      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false       # generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"

      - key: JWT_EXPIRES_IN
        value: 8h

      # ── Email (Resend) ────────────────────────────────────────────────────────
      - key: EMAIL_PROVIDER
        value: resend

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_FROM
        value: "AANM <no-reply@aanmassal.org>"

      - key: EMAIL_REPLY_TO
        value: "cabinet@aanmassal.org"
